<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Agent</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --ink: #1b1b1a;
      --accent: #c2410c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 56px 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      text-align: center;
    }
    main { max-width: 20ch; }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 7.5rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      font-weight: 800;
    }
    h1 span { color: var(--accent); }
    p {
      margin: 1.25rem 0 0;
      font-size: 1.125rem;
      line-height: 1.6;
      max-width: 60ch;
    }
  </style>
</head>
<body>
  <main>
    <h1>My agent <span>works</span></h1>
    <p>A single static page, served from one folder.</p>
  </main>
</body>
</html>
